syntax = "proto3";

package protocol;

option java_package = "org.tron.protos";
option java_outer_classname = "TransactionLogTriggerProtos";

message InternalTransactionPojo {
  string hash = 1;
  int64 call_value = 2;
  map<string, int64> token_info = 3;
  string transfer_to_address = 4;
  string data = 5;
  string caller_address = 6;
  bool rejected = 7;
  string note = 8;
  string extra = 9;
}

message LogPojo {
  string address = 1;
  string block_hash = 2;
  int64 block_number = 3;
  string data = 4;
  int64 log_index = 5;
  repeated string topic_list = 6;
  string transaction_hash = 7;
  int64 transaction_index = 8;
}

message TransactionLogTriggerPB {
  // Trigger base
  int64 time_stamp = 1;
  string trigger_name = 2;

  // Transaction info
  string transaction_id = 3;
  string block_hash = 4;
  int64 block_number = 5;
  int64 energy_usage = 6;
  int64 energy_fee = 7;
  int64 origin_energy_usage = 8;
  int64 energy_usage_total = 9;
  int64 net_usage = 10;
  int64 net_fee = 11;
  int64 memo_fee = 12;
  int64 multi_sign_fee = 13;
  int64 fee = 14;

  // Contract
  string result = 15;
  string tx_result = 16;
  string contract_address = 17;
  string contract_type = 18;
  int64 fee_limit = 19;
  int64 contract_call_value = 20;
  string contract_data = 21;
  string contract_result = 22;

  // Transfer
  string from_address = 23;
  string to_address = 24;
  string asset_name = 25;
  int64 asset_amount = 26;
  int64 latest_solidified_block_number = 27;

  // Internal transactions & logs
  repeated InternalTransactionPojo internal_transaction_list = 28;
  string data = 29;
  int32 transaction_index = 30;
  int64 cumulative_energy_used = 31;
  int64 pre_cumulative_log_count = 32;
  repeated LogPojo log_list = 33;
  int64 energy_unit_price = 34;
  string transaction_detail = 35;

  // Signatures
  repeated string signatures = 36;

  // ExtMap
  map<string, int64> ext_map = 37;
}
